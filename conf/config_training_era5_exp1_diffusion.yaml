hydra:
    job:
          chdir: false
          name: era5_exp1_tas_diffusion
    run:
          dir: ./outputs/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, training, and validation
defaults:

    - dataset: custom
    - model: diffusion
    # Second stage: needs the trained regression checkpoint, set below as
    # `training.io.regression_checkpoint_path`.
    - model_size: normal
    - training: ${model}

# Dataset parameters for ERA5 experiment 1 (near-surface air temperature).
dataset:
    type: datasets/era5_zarr.py::Era5ZarrDataset
    data_path: /work/bk1444/climbench/data/experiment1/regular
    stats_path: /work/k20200/k202223/corrdiff/stats/experiment1_tas.json
    input_variables: ["tas"]
    output_variables: ["tas"]
    invariant_variables: null

# Training parameters
training:
    hp:
        training_duration: 10000000
        total_batch_size: 16 # Total batch size across all GPUs. The actual batch size per GPU is determined by `total_batch_size / num_gpus`.
        batch_size_per_gpu: "auto"
        lr: 0.00005 # sqrt-scaled from the 2e-4 default (batch size 256) to batch size 16
        lr_rampup: 0
    io:
        # Best regression checkpoint (lowest validation loss); frozen during diffusion training
        regression_checkpoint_path: ./runs/exp1_bs16_gradckpt/checkpoints_regression/CorrDiffRegressionUNet.0.355008.mdlus

# Additional parameters for validation: same dataset, validation split.
validation:
    split: validation

# Parameters for wandb logging
wandb:
    mode: offline
    results_dir: "./wandb"
    watch_model: false
