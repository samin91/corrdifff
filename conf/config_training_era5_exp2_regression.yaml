hydra:
    job:
          chdir: false
          name: era5_exp2_tp_regression
    run:
          dir: ./outputs/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, training, and validation
defaults:

    - dataset: custom
    - model: regression
    # Train the regression stage first; the diffusion stage needs this
    # checkpoint as `training.io.regression_checkpoint_path`.
    - model_size: normal
    - training: ${model}

# Dataset parameters for ERA5 experiment 2 (precipitation).
dataset:
    type: datasets/era5_zarr.py::Era5ZarrDataset
    data_path: /work/bk1444/climbench/data/experiment2/regular
    stats_path: /work/k20200/k202223/corrdiff/stats/experiment2_tp.json
    input_variables: ["tp"]
    output_variables: ["tp"]
    invariant_variables: null

# Training parameters
training:
    hp:
        training_duration: 10000000
        total_batch_size: 256
        batch_size_per_gpu: "auto"
        lr: 0.0002
        lr_rampup: 0

# Additional parameters for validation: same dataset, validation split.
validation:
    split: validation

# Parameters for wandb logging
wandb:
    mode: offline
    results_dir: "./wandb"
    watch_model: false
